version: '3.9'

networks:
  chat_network:

volumes:
  mysql_data:
  redis_data:

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: chat_app
      MYSQL_USER: chat_user
      MYSQL_PASSWORD: chat_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [chat_network]

  redis:
    image: redis:7
    networks: [chat_network]

  backend:
    build: ./backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: chat_user
      DB_PASSWORD: chat_password
      DB_NAME: chat_app
    depends_on:
      - mysql
    networks: [chat_network]

  frontend:
    build: ./frontend
    ports:
      - "4200:80"   # ← Map port 4200 của VPS → port 80 bên trong Nginx container
    depends_on:
      - backend
    networks: [chat_network]
