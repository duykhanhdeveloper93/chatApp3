# Xóa version: '3.9' hoặc để '3.8' nếu muốn

networks:
  chat_network:

volumes:
  mysql_data:
  redis_data:

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: chat_app
      MYSQL_USER: chat_user
      MYSQL_PASSWORD: chat_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [chat_network]
    healthcheck:  # ← Thêm cái này
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    networks: [chat_network]
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: chat_user
      DB_PASSWORD: chat_password
      DB_NAME: chat_app
      NODE_ENV: production
      PORT: 3000
    depends_on:
      mysql:
        condition: service_healthy  # ← Quan trọng: chờ mysql healthy mới start backend
    networks: [chat_network]
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend  # Giữ nguyên, nhưng backend phải stable trước
    networks: [chat_network]
    restart: unless-stopped