<h2>Chat</h2>

<div class="chat-box">

  <div class="messages">
    <div *ngFor="let msg of messages" class="message">
      {{ msg }}
    </div>
  </div>

  <div class="input-area">
    <input
      [(ngModel)]="newMessage"
      placeholder="Type a message..."
    />
    <button (click)="send()">Send</button>
  </div>

</div>
