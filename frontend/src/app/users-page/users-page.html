<h2>User Management</h2>

<div class="toolbar">
  <input [(ngModel)]="search" placeholder="Search..." />
  <button (click)="loadUsers()">Search</button>
</div>

<table class="datatable">
  <thead>
    <tr>
      <th>Email</th>
      <th>Username</th>
      <th>Created</th>
      <th width="120">Action</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let u of users">
      <td>{{u.email}}</td>
      <td>{{u.username}}</td>
      <td>{{u.createdAt | date:'short'}}</td>
      <td>
        <button class="delete-btn" (click)="delete(u.id)">
          Delete
        </button>
      </td>
    </tr>
  </tbody>
</table>

<div class="datatable-footer">

  <div class="info">
    Showing {{startEntry}} to {{endEntry}} of {{meta.total || 0}} entries
  </div>

  <div class="pagination">
    <button 
      (click)="goToPage(page - 1)"
      [disabled]="page === 1">
      ‹
    </button>

    <button
      *ngFor="let p of pages"
      (click)="goToPage(p)"
      [class.active]="p === page">
      {{p}}
    </button>

    <button 
      (click)="goToPage(page + 1)"
      [disabled]="page === totalPages">
      ›
    </button>
  </div>

</div>
